# 部署到 GitHub Pages：每次推送到 main 自動建置並上線（網址 https://k3320509168.github.io/englearningapp/）
# 雲端存檔需要在 Settings → Secrets and variables → Actions 新增 VITE_SUPABASE_URL、VITE_SUPABASE_ANON_KEY；
# 沒有設定時網站照樣上線，只是沒有雲端存檔。
name: 部署上線

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 檢查與測試
        run: |
          npm run validate:questions
          npm test
      - name: 建置
        env:
          BASE_PATH: /englearningapp/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
