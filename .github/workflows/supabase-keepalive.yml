# Supabase 免費方案一週沒有使用會自動暫停：每天連一次資料庫保持運作
name: Supabase 保持喚醒

on:
  schedule:
    - cron: '0 18 * * *'   # 每天台灣時間凌晨 2 點
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 查詢一次資料庫
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ]; then echo "沒有設定 VITE_SUPABASE_URL，略過"; exit 0; fi
          curl -sf "$URL/rest/v1/saves?select=user_id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "ok"
